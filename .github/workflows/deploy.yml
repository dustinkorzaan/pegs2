name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The federated credential on managed identity pegs2-gh-actions
    # trusts this environment (subject ...:environment:production).
    environment:
      name: production
      url: ${{ steps.infra.outputs.url }}
    permissions:
      contents: read
      id-token: write # required for OIDC login to Azure
    env:
      RESOURCE_GROUP: pegs2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Azure login (OIDC, managed identity pegs2-gh-actions)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure (Bicep)
        id: infra
        run: |
          out=$(az deployment group create \
            --resource-group "$RESOURCE_GROUP" \
            --name "pegs2-${GITHUB_RUN_ID}" \
            --parameters infra/main.bicepparam \
            --query properties.outputs -o json)
          name=$(jq -r .name.value <<<"$out")
          host=$(jq -r .defaultHostname.value <<<"$out")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "url=https://$host" >> "$GITHUB_OUTPUT"

      - name: Get Static Web App deployment token
        id: token
        run: |
          token=$(az staticwebapp secrets list \
            --name "${{ steps.infra.outputs.name }}" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Upload site
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.token }}
          action: upload
          app_location: dist
          skip_app_build: true
          skip_api_build: true
